name: Task
description: A unit of work for the website
labels: []
body:
  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: What this delivers and why it is needed.
    validations: { required: true }
  - type: textarea
    id: procedure
    attributes:
      label: Procedure
      value: "1. \n2. "
    validations: { required: true }
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: The observable conditions that confirm the task is complete.
    validations: { required: true }
  - type: input
    id: files
    attributes: { label: Files affected }
