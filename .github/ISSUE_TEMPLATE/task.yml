name: Task
description: A unit of work for the website
labels: []
body:
  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: What this task delivers and why it is needed. One or two sentences.
    validations: { required: true }
  - type: textarea
    id: procedure
    attributes:
      label: Procedure
      value: "1. \n2. "
    validations: { required: true }
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: The observable conditions that confirm the task is complete.
    validations: { required: true }
  - type: input
    id: files
    attributes: { label: Files affected }
  - type: dropdown
    id: role
    attributes:
      label: Owner role
      options: [Project manager (Adib), Project manager (Yogesh), Lead developer, Designer, Content developer, QA and launch]
