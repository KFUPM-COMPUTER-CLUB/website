name: Bug report
description: A page is broken or renders incorrectly
labels: ["type: bug"]
body:
  - type: input
    id: page
    attributes: { label: Page, placeholder: "e.g. /events" }
    validations: { required: true }
  - type: textarea
    id: observed
    attributes:
      label: Observed behaviour
      description: What happens. Attach a screenshot where possible.
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: Expected behaviour }
    validations: { required: true }
  - type: dropdown
    id: environment
    attributes:
      label: Device and browser
      multiple: true
      options: [iPhone Safari, Android Chrome, Desktop Chrome, Desktop Firefox, Desktop Edge, Desktop Safari, Other]
    validations: { required: true }
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options: ["P0 - blocks launch", "P1 - should be fixed before launch", "P2 - minor"]
    validations: { required: true }
