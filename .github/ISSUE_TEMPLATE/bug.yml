name: Bug
description: Something on the site is broken or looks wrong
labels: ["type: bug"]
body:
  - type: input
    id: page
    attributes: { label: Which page?, placeholder: "e.g. /events" }
    validations: { required: true }
  - type: textarea
    id: what
    attributes: { label: What happened?, description: Add a screenshot if you can. }
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: What should happen? }
    validations: { required: true }
  - type: dropdown
    id: device
    attributes: { label: Device and browser, multiple: true, options: [iPhone Safari, Android Chrome, Desktop Chrome, Desktop Firefox, Desktop Edge, Desktop Safari, Other] }
    validations: { required: true }
  - type: dropdown
    id: prio
    attributes: { label: How bad?, options: ["P0 - must fix before launch", "P1 - should fix soon", "P2 - small thing"] }
    validations: { required: true }
