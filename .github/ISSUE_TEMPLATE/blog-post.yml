name: Article proposal
description: Propose an article for the website
labels: ["type: post", "needs approval"]
body:
  - type: input
    id: title
    attributes: { label: Working title }
    validations: { required: true }
  - type: dropdown
    id: category
    attributes:
      label: Category
      options: [News, Event recap, Tutorial, Project, Experience, Opinion, Announcement]
    validations: { required: true }
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Two or three sentences. State the subject and the intended audience.
    validations: { required: true }
  - type: input
    id: date
    attributes: { label: Expected date for the draft }
  - type: markdown
    attributes:
      value: "Editorial guidelines and the submission procedure: [docs/WRITING_A_POST.md](https://github.com/KFUPM-COMPUTER-CLUB/website/blob/main/docs/WRITING_A_POST.md)"
