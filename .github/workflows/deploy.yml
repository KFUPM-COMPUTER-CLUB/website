# Deployment to Vercel from GitHub Actions.
#   Pull request  -> preview deployment, with the URL posted as a comment on the pull request
#   Push to main  -> production deployment. When the push changes supabase/migrations (or the migrate
#                    script or workflow), the migrate job runs first and the deploy waits for it, so new
#                    code never goes live against a database without its new columns; a failed migrate
#                    stops the deploy. A push without migrations deploys straight away.
#
# Requires one repository secret: VERCEL_TOKEN (Settings -> Secrets and variables -> Actions).
# If package.json or the secret is missing, the job skips with a notice instead of failing.

name: deploy

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

# A newer preview replaces an older one; production runs are never cancelled, so a migrate is never cut off.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_PROJECT: cckfupm-website
  VERCEL_TELEMETRY_DISABLED: 1

jobs:
  # Did this push to main touch the database? Compares the push's first and last commit; when that is not
  # possible (a new branch, a force push) it says yes, since migrate only applies what is new anyway.
  changes:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      migrations: ${{ steps.diff.outputs.migrations }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Look for migration changes
        id: diff
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if ! files=$(git diff --name-only "$BEFORE" "$GITHUB_SHA" 2>/dev/null); then
            echo "::notice::Could not compare with the previous commit; running migrate to be safe."
            echo "migrations=true" >> "$GITHUB_OUTPUT"
          elif echo "$files" | grep -qE '^(supabase/migrations/|scripts/migrate\.sh$|\.github/workflows/migrate\.yml$)'; then
            echo "migrations=true" >> "$GITHUB_OUTPUT"
          else
            echo "migrations=false" >> "$GITHUB_OUTPUT"
          fi

  migrate:
    needs: changes
    if: needs.changes.outputs.migrations == 'true'
    uses: ./.github/workflows/migrate.yml
    secrets: inherit

  deploy:
    # Waits for migrate when it runs; goes ahead when it was skipped (no migrations, or a pull request).
    needs: [changes, migrate]
    if: >-
      always() && !cancelled() &&
      (needs.changes.result == 'success' || needs.changes.result == 'skipped') &&
      (needs.migrate.result == 'success' || needs.migrate.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check that there is something to deploy
        id: gate
        run: |
          if [ ! -f package.json ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No package.json found. Skipping deploy."
          elif [ -z "$VERCEL_TOKEN" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::The VERCEL_TOKEN secret is missing. A maintainer must add it. Skipping deploy."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Pick preview or production
        if: steps.gate.outputs.ready == 'true'
        id: target
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "env=production" >> "$GITHUB_OUTPUT"
            echo "flag=--prod" >> "$GITHUB_OUTPUT"
          else
            echo "env=preview" >> "$GITHUB_OUTPUT"
            echo "flag=" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v5
        if: steps.gate.outputs.ready == 'true'
        with:
          node-version: 24

      - name: Install the Vercel CLI
        if: steps.gate.outputs.ready == 'true'
        run: npm install --global vercel@latest

      - name: Link the Vercel project
        if: steps.gate.outputs.ready == 'true'
        run: vercel link --yes --project "$VERCEL_PROJECT" --token "$VERCEL_TOKEN"

      - name: Pull Vercel settings
        if: steps.gate.outputs.ready == 'true'
        run: vercel pull --yes --environment=${{ steps.target.outputs.env }} --token "$VERCEL_TOKEN"

      - name: Build
        if: steps.gate.outputs.ready == 'true'
        run: vercel build ${{ steps.target.outputs.flag }} --token "$VERCEL_TOKEN"

      - name: Deploy
        if: steps.gate.outputs.ready == 'true'
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt ${{ steps.target.outputs.flag }} --token "$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### Deployed (${{ steps.target.outputs.env }}): $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment the preview link on the PR
        if: steps.gate.outputs.ready == 'true' && github.event_name == 'pull_request'
        uses: actions/github-script@v8
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        with:
          script: |
            const marker = '<!-- vercel-preview -->';
            const sha = context.payload.pull_request.head.sha.slice(0, 7);
            const body = `${marker}\n**Preview deployment:** ${process.env.PREVIEW_URL}\n\nBuilt from commit \`${sha}\`. Verify the change on a phone and a laptop before approving.`;
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo, issue_number: context.issue.number, per_page: 100,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }
